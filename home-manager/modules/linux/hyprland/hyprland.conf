###############
### PROGRAMS ##
###############

$terminal = ghostty
$fileManager = thunar
$menu = wofi --show drun
$browser = brave --password-store=gnome

# hyprpanel is NOT started here. programs.hyprpanel already installs a
# hyprpanel.service user unit with an X-Restart-Triggers on its config, so
# home-manager restarts it on switch. An exec-once copy would win the
# single-instance race, leave the unit in `failed`, and pin the panel to
# whatever config it was launched with — which is why theme edits appeared
# to do nothing.
# Clipboard history, read back with $mainMod SHIFT V below.
exec-once = wl-paste --watch cliphist store

# Tear the session down on exit. Without this, graphical-session.target stays
# active after the compositor is gone, so every service bound to it (hyprpanel
# especially) crash-loops against a dead display instead of stopping cleanly.
exec-shutdown = systemctl --user stop graphical-session.target

#############
### ENV #####
#############

# Cursor theme/size come from home.pointerCursor (Nordzy-cursors @ 24) which
# exports XCURSOR_THEME/XCURSOR_SIZE session-wide. Don't re-declare them here or
# XWayland (i.e. every Proton game) ends up with a different size than Wayland.

# AQ_DRM_DEVICES (GPU pinning) is host-specific and lives in hyprland.nix,
# which has osConfig and can key it on the hostname. It must not be set here:
# this file is shared by every Linux host.

# Qt apps that ship no wayland platform plugin (DaVinci Resolve, some installers)
# fall back to xcb instead of aborting on startup.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 2

    # Gruvbox Material: yellow -> orange gradient, animated by the borderangle
    # loop below. Matches ghostty/zellij/neovim, which are all gruvbox.
    col.active_border = rgba(d8a657ee) rgba(e78a4eee) 45deg
    col.inactive_border = rgba(3c3836aa)

    resize_on_border = false

    # Lets windows with the `immediate` rule below tear instead of waiting for
    # vblank. Without at least one `immediate` window rule this does nothing.
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6

    # Both must be in the 0.0 - 1.0 range.
    active_opacity = 1.0
    inactive_opacity = 1.0

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1d2021cc)
    }
}

# Blur only affects windows by default. These are the layers where it is most
# visible — the launcher and hyprpanel's bar/notifications.
layerrule = blur, wofi
layerrule = ignorealpha 0.3, wofi
# One namespace per bar, named bar-<hyprland monitor id> -- so `bar-0` only ever
# blurred whichever bar happened to land on monitor 0, and matched nothing at all
# once the ids shifted. Hyprland matches layer namespaces as a regex.
layerrule = blur, bar-.*
layerrule = blur, notifications

# https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 4, default
    # `loop` continuously rotates the gradient on the focused window's border.
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
    # Without this, wofi and hyprpanel's notifications appear instantly while
    # every window animates — the one visibly unpolished transition left.
    animation = layers, 1, 3, default, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # Variable refresh rate. 2 = fullscreen-only: games get the full G-Sync /
    # FreeSync range, while the desktop stays at a fixed rate so the panel
    # doesn't flicker on low-framerate content (bar clocks, idle windows).
    vrr = 2

    # Don't drop to a lower render rate while a fullscreen game is up.
    vfr = true
}

#####################
### RENDERING #######
#####################

render {
    # Hand a solitary fullscreen window straight to the display controller,
    # skipping compositing entirely. This is the single biggest latency win for
    # fullscreen games; it silently disengages the moment anything else needs
    # to be drawn on top (notifications, the bar, an overlay).
    direct_scanout = 1
}

cursor {
    # 2 = auto. Software cursors while tearing/scanout is engaged, hardware
    # cursors otherwise.
    no_hardware_cursors = 2
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # Never apply pointer acceleration to raw mouse input. Games read these
    # deltas directly, so acceleration makes aim inconsistent.
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

####################
### KEYBINDINGS  ###
####################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
# Not on SUPER+J: Hyprland matches key names case-insensitively, so it would
# shadow the SUPER+j movefocus bind below.
bind = $mainMod, T, togglesplit,

bind = $mainMod SHIFT, E, exit,
# Alias, kept because SUPER+SHIFT+E is one missed SHIFT away from SUPER+E
# (file manager).
bind = $mainMod SHIFT CTRL, Q, exit,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# Resize the focused window
binde = $mainMod CTRL, h, resizeactive, -40 0
binde = $mainMod CTRL, l, resizeactive, 40 0
binde = $mainMod CTRL, k, resizeactive, 0 -40
binde = $mainMod CTRL, j, resizeactive, 0 40

# Throw the focused window / whole workspace to the other monitor
bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r
bind = $mainMod CTRL, left, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL, right, movecurrentworkspacetomonitor, r

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots. The file variant copies to the clipboard as well and notifies,
# so there is some feedback that it actually fired.
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, grim - | wl-copy
bind = $mainMod, PRINT, exec, f=~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png; grim -g "$(slurp)" "$f" && wl-copy < "$f" && notify-send -a screenshot "Screenshot saved" "$f"

# Clipboard history and colour picker
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod SHIFT, P, exec, hyprpicker -a -n

# Audio / media. `l` = works while locked, `e` = repeats when held.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

################
### MONITORS ###
################

# Every output gets an explicit origin. `auto-left`/`auto-right` are resolved in
# connection order against whatever is already placed, so they only ever
# described a two-monitor desk. The Elgato Prompter is a third output and fell
# through to the catch-all rule below, which put it at 0x0 first; both LGs then
# laid themselves out around it and HDMI-A-2 ended up at x=1024 rather than
# x=2560. Fixed coordinates are the only arrangement that survives a hotplug or
# a change in probe order.
#
# Both UltraGears advertise 2560x1440@120 as their EDID-preferred mode but can
# actually do 144. `preferred` would silently leave 24Hz on the table.
#
# Left to right: Prompter, 404NTBKAV757 (primary), 108MXBP68917.
monitor = desc:IDI Elgato Prom. 0x01348D27,1024x600@60.11,0x0,1
monitor = desc:LG Electronics LG ULTRAGEAR 404NTBKAV757,2560x1440@143.93,1024x0,1
monitor = desc:LG Electronics LG ULTRAGEAR 108MXBP68917,2560x1440@143.93,3584x0,1
monitor = Unknown-1,disable
monitor = ,preferred,auto,1

# Pin workspaces to a specific panel. Without this, which monitor a workspace
# opens on depends on what happened to be focused at the time.
#
# 1-5 go to 404NTBKAV757, the left-hand panel — that is the primary display, so
# workspace 1 should land there on login.
workspace = 1, monitor:desc:LG Electronics LG ULTRAGEAR 404NTBKAV757, default:true
workspace = 2, monitor:desc:LG Electronics LG ULTRAGEAR 404NTBKAV757
workspace = 3, monitor:desc:LG Electronics LG ULTRAGEAR 404NTBKAV757
workspace = 4, monitor:desc:LG Electronics LG ULTRAGEAR 404NTBKAV757
workspace = 5, monitor:desc:LG Electronics LG ULTRAGEAR 404NTBKAV757
workspace = 6, monitor:desc:LG Electronics LG ULTRAGEAR 108MXBP68917, default:true
workspace = 7, monitor:desc:LG Electronics LG ULTRAGEAR 108MXBP68917
workspace = 8, monitor:desc:LG Electronics LG ULTRAGEAR 108MXBP68917
workspace = 9, monitor:desc:LG Electronics LG ULTRAGEAR 108MXBP68917
workspace = 10, monitor:desc:LG Electronics LG ULTRAGEAR 108MXBP68917

# 11 is the Prompter's. Without a rule Hyprland invents an unnamed workspace on
# it the moment it is focused, which is then the only thing hyprpanel has to
# render there. Deliberately outside the 1-10 range the keybinds cover: nothing
# should land here by accident, it is reached by moving focus onto the screen.
workspace = 11, monitor:desc:IDI Elgato Prom. 0x01348D27

# Smart gaps: strip the gaps, border and rounding when a workspace holds a
# single window, so it sits flush against the screen edge. The old
# `dwindle:no_gaps_when_only` that did this was removed upstream; the selector
# form below replaces it.
#
#   w[tv1] = workspace with exactly 1 tiled, visible window
#   f[1]   = workspace with a fullscreen window
#
# The gaps come off via workspace rules, but border and rounding are per-window
# properties, so they need matching windowrules. `floating:0` keeps floating
# windows (steam, pavucontrol, the portal dialogs) looking normal — they should
# keep their border even when they are the only thing on the workspace.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

xwayland {
  force_zero_scaling = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule = suppressevent maximize, class:.*

# Fix XWayland windows that report a bogus initial position.
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

### Steam client
# Hyprland matches with RE2, which has no negative lookahead, so the previous
# `title:^(?!Steam$).*` never compiled — every startup logged
# "RuleRegexContainer: regex ... failed to parse" and these rules did nothing.
# Expressed the other way round instead: float everything, then tile the main
# window, since the later matching rule wins.
windowrule = float, class:^(steam)$
windowrule = center, class:^(steam)$
windowrule = tile, class:^(steam)$, title:^(Steam)$

# Steam webhelper (friends/news/login popups)
windowrule = float, class:^(steamwebhelper)$
windowrule = center, class:^(steamwebhelper)$

### Games
# Tag Proton/native Steam titles as game content. Hyprland uses this to pick
# the right scaling filter and to let VRR/scanout engage.
windowrule = content game, class:^(steam_app_.*)$
windowrule = content game, class:^(gamescope)$

# Let games present as soon as a frame is ready rather than blocking on vblank.
# `general:allow_tearing` above is the master switch; these opt individual
# windows in. Hyprland ignores this while VRR is actually engaged.
windowrule = immediate, class:^(steam_app_.*)$
windowrule = immediate, class:^(gamescope)$
windowrule = immediate, class:^(cs2|hl2_linux|factorio|dota2)$

# Compositor effects on a fullscreen game are pure wasted GPU time.
windowrule = noblur, class:^(steam_app_.*)$
windowrule = noblur, class:^(gamescope)$
windowrule = norounding, class:^(steam_app_.*)$
windowrule = norounding, class:^(gamescope)$
windowrule = noanim, class:^(steam_app_.*)$
windowrule = noanim, class:^(gamescope)$
windowrule = opaque, class:^(steam_app_.*)$
windowrule = opaque, class:^(gamescope)$

# gamescope wants the whole output to itself.
windowrule = fullscreen, class:^(gamescope)$

# NOTE: games are deliberately NOT force-fullscreened. Forcing it fights the
# game's own mode-setting and leaves launchers/intro videos as black screens;
# let the title ask for fullscreen itself.

# Anything fullscreen (game or video) blocks the idle timer.
windowrule = idleinhibit fullscreen, class:.*

# Screen-share picker and auth prompts need to be on top.
windowrule = float, class:^(xdg-desktop-portal-gtk|org.freedesktop.impl.portal.desktop.kde)$
windowrule = center, class:^(xdg-desktop-portal-gtk|org.freedesktop.impl.portal.desktop.kde)$
windowrule = float, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = center, class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
