# Repo-wide formatting. Run `treefmt` from anywhere inside the tree.
#
# Lives at the repo root rather than being wired into a flake because the two
# flakes here (nixos/, nix-darwin/) are in subdirectories, so `nix fmt` from
# either would only ever see its own subtree. Backends are installed via
# home-manager/modules/base.nix.
#
# .el files are intentionally unformatted: there is no non-Emacs formatter for
# elisp, and shelling out to emacs --batch per file is too slow to be useful.

# nixos/users/clara.nix is a stray 0-byte file — the clara user is actually
# defined inline in nixos/machines/beara/beara.nix, and nothing imports it.
# nixfmt errors on empty input, so exclude it until the file is deleted.
excludes = [
  "nixos/users/clara.nix",
  # Machine-generated by nixos-facter. Reformatting these would be re-churned
  # on every regeneration and would bury real hardware diffs in noise.
  "nixos/hardware/facter/*.json",
  # SOPS-encrypted secret stores. sops owns the serialisation of these files;
  # reformatting them is pure churn at best and risks the integrity MAC at
  # worst. Never hand them to a formatter.
  "nixos/secrets/*.yaml",
]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.lua]
command = "stylua"
includes = ["*.lua"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.shell]
command = "shfmt"
options = ["-i", "2", "-s", "-w"]
includes = ["*.sh"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.md", "*.yaml", "*.yml", "*.css"]
excludes = ["*.lock", "flake.lock"]
